name: Spool
options:
  bundleIdPrefix: com.anilipeksumer
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: LUPJND3R24
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
packages:
  SpoolKit:
    path: Packages/SpoolKit
targets:
  Spool:
    type: application
    platform: macOS
    sources:
      - path: Spool
    dependencies:
      - package: SpoolKit
    info:
      path: Spool/Info.plist
      properties:
        CFBundleDisplayName: Spool
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: © 2026 Anıl İpeksümer
        NSLocalNetworkUsageDescription: Spool connects to Redis and RabbitMQ servers on your network.
    entitlements:
      path: Spool/Spool.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anilipeksumer.spool
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
schemes:
  Spool:
    build:
      targets:
        Spool: all
    test:
      targets: []
